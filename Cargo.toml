[workspace]
default-members = [ "crates/koruma" ]
members = [
  "crates/koruma",
  "crates/koruma-collection",
  "crates/koruma-core",
  "crates/koruma-derive",
  "crates/koruma-derive-core",
  "tests/koruma-derive-fixtures",
  "examples/readme",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/koruma"
rust-version = "1.99"
version = "0.13.0"

[workspace.dependencies]
anyhow = "1.0.104"
attribute-dsl = "0.2.2"
bon = "3.10.2"
card-validate = "2.4.0"
clap = "4.6.7"
dioxus = { default-features = false, version = "0.7.10" }
dioxus-free-icons = { default-features = false, version = "0.10.0" }
dioxus-primitives = { default-features = false, git = "https://github.com/DioxusLabs/components", version = "0.0.1" }
email_address = "0.2.9"
es-fluent = "0.21.0"
es-fluent-build = "0.21.0"
es-fluent-lang = "0.21.0"
es-fluent-manager-dioxus = { default-features = false, version = "0.21.0" }
es-fluent-manager-embedded = "0.21.0"
fluent-syntax = "0.12.0"
heck = "0.5.0"
idna = "1.1.0"
insta = "1.49.0"
inventory = "0.3.25"
koruma = { path = "crates/koruma", version = "0.13.0" }
koruma-collection = { path = "crates/koruma-collection", version = "0.13.0" }
koruma-core = { path = "crates/koruma-core", version = "0.13.0" }
koruma-derive = { path = "crates/koruma-derive", version = "0.13.0" }
koruma-derive-core = { path = "crates/koruma-derive-core", version = "0.13.0" }
lsp-types = "0.97.0"
paste = "1.0.15"
phonenumber = "0.3.10"
prettyplease = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = { default-features = false, features = [ "std" ], version = "1.12.0" }
quote = "1.0.47"
regex = "1.13.1"
rust-embed = "8.13.0"
rust_decimal = "1.43.0"
serde_json = "1.0.154"
smallvec = "1.16.3"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
strum = "0.28.0"
syn = "3.0.9"
tempfile = "3.27.0"
trybuild = "1.0.122"
unic-langid = "0.9.6"
url = "2.5.8"
web = { path = "web" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
