[workspace]
default-members = [ "crates/koruma" ]
members = [
  "crates/koruma",
  "crates/koruma-collection",
  "crates/koruma-core",
  "crates/koruma-derive",
  "crates/koruma-derive-core",
  "examples/readme",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/koruma"
rust-version = "1.96"
version = "0.10.0"

[workspace.dependencies]
anyhow = "1.0"
attribute-dsl = "0.1"
bon = "3.9"
card-validate = "2.4"
clap = "4.6"
dioxus = { default-features = false, version = "0.7" }
dioxus-free-icons = { default-features = false, version = "0.10" }
dioxus-primitives = { default-features = false, git = "https://github.com/DioxusLabs/components", version = "0.0.1" }
email_address = "0.2"
es-fluent = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-build = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-lang = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-manager-dioxus = { default-features = false, git = "https://github.com/stayhydated/es-fluent" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent" }
fluent-syntax = "0.12"
heck = "0.5"
idna = "1.1"
insta = "1.48"
inventory = "0.3"
koruma = { path = "crates/koruma", version = "0.10.0" }
koruma-collection = { path = "crates/koruma-collection", version = "0.10.0" }
koruma-core = { path = "crates/koruma-core", version = "0.10.0" }
koruma-derive = { path = "crates/koruma-derive", version = "0.10.0" }
koruma-derive-core = { path = "crates/koruma-derive-core", version = "0.10.0" }
lsp-types = "0.97"
paste = "1.0"
phonenumber = "0.3"
prettyplease = "0.2"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
regex = "1.13"
rust-embed = "8.12"
rust_decimal = "1.42"
serde_json = "1.0"
smallvec = "1.15"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "4e50ee5e757dbfc2fc38f2e459d76bcce3827b4e" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "4e50ee5e757dbfc2fc38f2e459d76bcce3827b4e" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "4e50ee5e757dbfc2fc38f2e459d76bcce3827b4e" }
strum = "0.28"
syn = "2.0"
tempfile = "3"
trybuild = "1.0"
unic-langid = "0.9"
url = "2.5"
web = { path = "web" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
