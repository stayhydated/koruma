codecov:
  require_ci_to_pass: true

# https://docs.codecov.com/docs/components
components:
  - name: "koruma"
    paths:
      - crates/koruma
    description: "Public facade crate, re-exports core traits and derive macros, defines feature gates."

  - name: "koruma-core"
    paths:
      - crates/koruma-core
    description: "Core traits and optional showcase registry types."

  - name: "koruma-derive"
    paths:
      - crates/koruma-derive
    description: "Proc-macros for validators, error structs, and helper derives."

  - name: "koruma-derive-core"
    paths:
      - crates/koruma-derive-core
    description: "Attribute parsing and utilities shared by derive macros."

  - name: "koruma-collection"
    paths:
      - crates/koruma-collection
    description: "Built-in validators with optional fluent/i18n resources."

  - name: "xtask"
    paths:
      - xtask
    description: "Development task automation helpers."

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%
