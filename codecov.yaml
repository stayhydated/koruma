codecov:
  require_ci_to_pass: true

# https://docs.codecov.com/docs/components
component_management:
  individual_components:
    - component_id: koruma
      name: "koruma"
      paths:
        - crates/koruma/**

    - component_id: koruma-core
      name: "koruma-core"
      paths:
        - crates/koruma-core/**

    - component_id: koruma-derive
      name: "koruma-derive"
      paths:
        - crates/koruma-derive/**

    - component_id: koruma-derive-core
      name: "koruma-derive-core"
      paths:
        - crates/koruma-derive-core/**

    - component_id: koruma-collection
      name: "koruma-collection"
      paths:
        - crates/koruma-collection/**

    - component_id: xtask
      name: "xtask"
      paths:
        - xtask/**

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 90%
        threshold: 5%
    patch:
      default:
        target: 90%
        threshold: 10%
