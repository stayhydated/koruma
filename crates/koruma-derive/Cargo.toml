[package]
name = "koruma-derive"
description = """
Derive crate for koruma
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
fluent = [  ]
internal-showcase = [ "koruma-derive-core/internal-showcase" ]

[lib]
proc-macro = true

[dependencies]
heck = { workspace = true }
koruma-derive-core = { features = [  ], workspace = true }
proc-macro-error2 = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { features = [ "full", "extra-traits", "visit" ], workspace = true }
syn-cfg-attr = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
prettyplease = { workspace = true }
renamed-koruma = { default-features = false, package = "koruma", path = "../koruma" }
trybuild = { workspace = true }

[package.metadata.docs.rs]
features = [ "fluent" ]
