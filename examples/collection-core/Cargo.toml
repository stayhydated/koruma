[package]
name = "koruma-collection-example-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license = "Unlicense"
publish = false

[dependencies]
anyhow = { workspace = true }
es-fluent = { features = [ "derive" ], workspace = true }
es-fluent-manager-embedded = { workspace = true }
koruma = { features = [ "internal-showcase", "derive" ], workspace = true }
koruma-collection = { features = [ "internal-showcase" ], workspace = true }
koruma-shared-lib = { path = "../shared-lib" }
ratatui = { workspace = true }
rust-embed = { workspace = true }
unic-langid = { workspace = true }

[build-dependencies]
es-fluent = { features = [ "build" ], workspace = true }

[package.metadata.cargo-machete]
ignored = [ "es-fluent", "rust-embed" ]
