[package]
name = "collection-dioxus-web"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license = "Unlicense"
publish = false

[lib]
crate-type = [ "cdylib", "rlib" ]

[dependencies]
console_error_panic_hook = { workspace = true }
dioxus = { features = [ "web" ], workspace = true }
es-fluent = { features = [ "derive" ], workspace = true }
es-fluent-manager-embedded = { workspace = true }
koruma = { features = [ "internal-showcase", "derive", "fluent" ], workspace = true }
koruma-collection = { features = [ "internal-showcase" ], workspace = true }
koruma-shared-lib = { path = "../shared-lib" }
strum = { features = [ "derive" ], workspace = true }
unic-langid = { workspace = true }
wasm-bindgen = { workspace = true }
